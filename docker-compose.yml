# Leilão online — tudo o que roda na VM.
#
#   cp .env.example .env && docker compose up -d --build
#
# Só o serviço `web` (Caddy) publica porta: ele serve as telas e encaminha /api
# e /socket.io para a API. Banco, API e worker ficam na rede interna do Compose.
# A única exceção é a pasta opcional de fotos (ARMAZENAMENTO=disco), montada via
# bind: a mesma definição funciona apontando o Docker para a VM por SSH.
#
# Bônus 7.2, tudo pelo .env (ver .env.vm.example):
#   - várias instâncias da API:  API_REPLICAS (padrão 2); o Caddy distribui entre elas
#   - HTTPS com domínio:         SITE_ADDRESS=dominio, PORTA_PUBLICA=80, PORTA_HTTPS=443
#   - banco gerenciado:          DATABASE_URL + COMPOSE_FILE com docker-compose.gerenciado.yml

name: leilao

x-backend: &backend
  build:
    context: ./backend
    target: prod
  restart: unless-stopped
  env_file: ${ARQUIVO_ENV:-.env}
  environment:
    PORT: "3000"
    DATABASE_URL: ${DATABASE_URL:-postgres://leilao:${POSTGRES_PASSWORD:-leilao}@db:5432/leilao}
  depends_on:
    db:
      condition: service_healthy
      # com banco gerenciado o serviço `db` nem sobe (docker-compose.gerenciado.yml)
      required: false
  # Modo ARMAZENAMENTO=disco: a pasta do host fica visível para API e seed.
  volumes:
    - ${PASTA_FOTOS_HOST:-./dados/fotos}:${PASTA_FOTOS:-/dados/fotos}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leilao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leilao}
      POSTGRES_DB: leilao
    volumes:
      - dados_banco:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leilao -d leilao"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3 local, só para desenvolvimento (perfil "local"). Quando o serviço de
  # armazenamento da organização for conhecido, as fotos vão para ele e este
  # contêiner nem sobe.
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: ["local"]
    restart: unless-stopped
    user: "0:0"
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin123}
    volumes:
      - dados_fotos_local:/data

  # Mais de uma instância: nenhuma guarda estado em memória. Lances formam fila
  # no banco, os eventos chegam a todas por LISTEN/NOTIFY e a presença nas salas
  # também fica no banco.
  api:
    <<: *backend
    command: ["node", "dist/api.js"]
    deploy:
      replicas: ${API_REPLICAS:-2}

  # Também pode ter mais de um: abrir e fechar são UPDATEs condicionais.
  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${PORTA_PUBLICA:-8080}:80"
      # só responde quando SITE_ADDRESS é um domínio (o Caddy emite o certificado)
      - "${PORTA_HTTPS:-8443}:443"
    volumes:
      # certificados emitidos: sobrevivem a recriar o contêiner
      - dados_caddy:/data
      - config_caddy:/config
    depends_on:
      - api

volumes:
  dados_banco:
  dados_caddy:
  config_caddy:
  dados_fotos_local:
